name: Auto-Build React

on:
  push:
    branches:
      - main
    paths:
      # Only trigger the build when the actual React code changes
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.js'
      - 'tailwind.config.js'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    
    # Grants the bot permission to push code back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Move dist to HA Add-on folder
        run: |
          rm -rf ha-addon/dist
          cp -R dist ha-addon/dist

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build React frontend"
          file_pattern: "ha-addon/dist/**"